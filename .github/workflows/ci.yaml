name: CI

"on":
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Go と lint のツールは flake.nix の devShell から取る｡版の正本は flake.lock｡
# nix-develop が devShell の PATH と env を GITHUB_PATH / GITHUB_ENV に書くので、以後の step は素で動く｡
jobs:
  ci-status-check:
    runs-on: ubuntu-slim
    if: always()
    timeout-minutes: 10
    needs:
      - test
      - lint
      - arch-lint
      - actions-lock
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Load devShell
        uses: nicknovitski/nix-develop@v1.2.1

      - name: Run tests
        run: go test ./... -v -race -coverprofile=coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Load devShell
        uses: nicknovitski/nix-develop@v1.2.1

      - name: Format code
        run: |
          task format
          if [ -n "$(git status --porcelain)" ]; then
            echo "Code is not formatted properly"
            git diff
            exit 1
          fi

      - name: Run lint
        run: task lint

      - name: Run security checks
        run: task lint:sec

  arch-lint:
    name: Architecture Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Load devShell
        uses: nicknovitski/nix-develop@v1.2.1

      - name: Run architecture lint
        run: task arch-lint

  actions-lock:
    name: Actions Lock Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.2.0

      - name: Verify actions are locked
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify
