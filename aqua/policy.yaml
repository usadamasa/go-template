---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/policy.json
# aqua/registry.yaml のローカルレジストリを許可する｡
# path はこのファイルからの相対で解決される (aqua.yaml からではない)｡
registries:
  - type: standard
    ref: semver(">= 4.0.0")
  - name: local
    type: local
    path: registry.yaml

packages:
  - registry: standard
  - registry: local
